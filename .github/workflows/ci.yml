name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        # 只装轻量依赖。真正装不进 CI 的是浏览器栈（camoufox / playwright /
        # hcaptcha-challenger）—— 体积上 GB 且要下载浏览器二进制。
        # 依赖它们的测试在下一步里显式排除，不靠"跑挂了就当作跳过"的猜测。
        run: |
          python -m pip install --upgrade pip
          pip install pytest fakeredis \
                      fastapi uvicorn jinja2 python-multipart apscheduler httpx requests redis \
                      pydantic pydantic-settings cryptography loguru pytz tenacity \
                      ruff black

      - name: 静态检查
        # 首次接入，先只报告不拦截；等存量问题清理完再去掉 continue-on-error。
        continue-on-error: true
        run: |
          ruff check .
          black --check .

      - name: 单元测试
        # 排除的 5 个文件都直接或间接 import 浏览器栈：
        #   test_captcha_solver   -> hcaptcha_challenger
        #   test_checkout_results -> services.epic_games_service -> hcaptcha_challenger
        #   test_deploy_modes     -> app.deploy -> camoufox
        #   test_login_captcha    -> services.epic_authorization_service -> app.settings -> hcaptcha_challenger
        #   test_provider_router  -> app.settings -> hcaptcha_challenger
        # 它们要在 worker 镜像里跑，方式见 AGENTS.md。
        run: |
          python -m pytest tests -q \
            --ignore=tests/test_captcha_solver.py \
            --ignore=tests/test_checkout_results.py \
            --ignore=tests/test_deploy_modes.py \
            --ignore=tests/test_login_captcha.py \
            --ignore=tests/test_provider_router.py
        env:
          DATA_DIR: /tmp/epic-kiosk-ci
          INTERNAL_API_TOKEN: ci-test-token
          EPIC_CREDENTIAL_KEYS: 9QKUvZF-uPSzD4suKpprhwUTUyoj5nrR9BgeJeAs5mM=
          GEMINI_API_KEY: not_used
          ENABLE_APSCHEDULER: "false"
