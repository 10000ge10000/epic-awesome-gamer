# ============================================================
# Epic Kiosk - 自动驾驶领取系统（本地编译版本）
# ============================================================
# GitHub: https://github.com/10000ge10000/epic-kiosk
# 公益站点: https://epic.910501.xyz/
# ============================================================
#
# 🚀 部署方式：
#   1. Linux 一键部署: curl -fsSL https://raw.githubusercontent.com/10000ge10000/epic-kiosk/main/install.sh | bash
#   2. 手动部署: 克隆项目 → 修改 API Key → docker compose up -d --build
#
# ⚠️ 必须修改: API_KEY
#    Configure it in .env; NVIDIA, SiliconFlow, and custom OpenAI-compatible providers are supported.
#
# 📦 镜像说明：
#   - redis:alpine - 官方镜像，直接拉取
#   - epic-kiosk-web - 本地编译
#   - epic-kiosk-worker - 本地编译（含 WARP 网络代理）
# ============================================================

services:
  # ============================================================
  # Redis: 消息队列（官方镜像）
  # ============================================================
  redis:
    image: redis@sha256:c5e375abb885e6b2021c0377879e4890bf76f9065b8922ffc113f2b226b9fc17
    container_name: epic-redis
    restart: always

    # 容器 mem_limit 是 256m，但 redis 自己原本 maxmemory=0（无上限），
    # 到限时会被内核 OOM Kill 而不是按策略拒写。noeviction 保证队列不被淘汰。
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "noeviction", "--save", "300", "10"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 256m

  # ============================================================
  # Web: 前端服务（FastAPI）
  # 本地编译，首次部署约需 2-3 分钟
  # ============================================================
  web:
    build:
      context: .
    image: epic-kiosk-web:local
    container_name: epic-web
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - REDIS_HOST=redis
      - TZ=Asia/Shanghai
      - ENABLE_APSCHEDULER=true
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-172.22.0.1}
      - INTERNAL_API_TOKEN_FILE=/run/secrets/internal_api_token
      - EPIC_CREDENTIAL_KEYS_FILE=/run/secrets/epic_credential_keys
      - TASK_LOCK_SECONDS=86400
      - CONFIRM_TOKEN_SECONDS=86400
      - DAILY_SCHEDULE_LOCK_SECONDS=86400
      - CLAIM_BATCH_SIZE=${CLAIM_BATCH_SIZE:-5}
      - CLAIM_BATCH_INTERVAL_SECONDS=${CLAIM_BATCH_INTERVAL_SECONDS:-600}
      - PROMOTION_REFRESH_INTERVAL_SECONDS=${PROMOTION_REFRESH_INTERVAL_SECONDS:-3600}
      # 可选历史数据偏移量，默认不补偿。
      - CLAIM_HISTORY_OFFSET=${CLAIM_HISTORY_OFFSET:-0}
      - ACCOUNT_VERIFIED_OFFSET=${ACCOUNT_VERIFIED_OFFSET:-0}
      - ACCOUNT_TOTAL_OFFSET=${ACCOUNT_TOTAL_OFFSET:-0}
    depends_on:
      redis:
        condition: service_healthy
    restart: always
    secrets:
      - internal_api_token
      - epic_credential_keys
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # WARP 代理：单容器多出口（10 个独立 WARP 实例）
  # 端口: epic-warp:19000-19009
  # 控制接口: http://epic-warp:18080/restart/{idx}
  # ============================================================
  warp:
    image: zen-warp-multi:local
    container_name: epic-warp
    restart: always
    init: true
    privileged: true
    environment:
      - WARP_INSTANCE_COUNT=10
      - WARP_START_PORT=19000
      - WARP_CONTROL_PORT=18080
    volumes:
      - ./data/warp:/warp-data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 8m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 5g


  # ============================================================
  # Worker: 后台任务执行器（浏览器自动化）
  # 本地编译，首次部署约需 5-10 分钟
  # 通过 WARP 代理访问 Epic Games
  # ============================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: epic-kiosk-worker:local
    container_name: epic-worker
    user: "1002:1002"
    init: true
    cpus: "2.00"
    pids_limit: 300
    volumes:
      - ./data:/app/data
      - ./data:/app/app/volumes
    environment:
      - REDIS_HOST=redis
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - ENABLE_APSCHEDULER=false
      - API_PROVIDER=${API_PROVIDER:-siliconflow}
      - API_BASE_URL=${API_BASE_URL:-https://api.siliconflow.cn/v1}
      - API_KEY_FILE=${API_KEY_FILE:-/run/secrets/captcha_siliconflow_api_key}
      - OPENCODE_BASE_URL=https://opencode.ai/zen
      - INTERNAL_API_TOKEN_FILE=/run/secrets/internal_api_token
      - EPIC_CREDENTIAL_KEYS_FILE=/run/secrets/epic_credential_keys
      - CAPTCHA_NVIDIA_API_KEY_FILE=/run/secrets/captcha_nvidia_api_key
      - CAPTCHA_SILICONFLOW_API_KEY_FILE=/run/secrets/captcha_siliconflow_api_key
      - TASK_TIMEOUT_SECONDS=600
      - TASK_SOFT_TIMEOUT_SECONDS=480
      - TASK_MIN_GAME_BUDGET_SECONDS=180
      - TASK_LOCK_SECONDS=86400
      - HCAPTCHA_EXECUTION_TIMEOUT=${HCAPTCHA_EXECUTION_TIMEOUT:-180}
      - HCAPTCHA_RESPONSE_TIMEOUT=${HCAPTCHA_RESPONSE_TIMEOUT:-90}
      - HCAPTCHA_PAYLOAD_TIMEOUT=${HCAPTCHA_PAYLOAD_TIMEOUT:-90}
      - HCAPTCHA_FRAME_TIMEOUT=20
      - HCAPTCHA_SOLVE_MAX_ATTEMPTS=2
      - HCAPTCHA_LOG_DIR=/app/data/logs/hcaptcha
      # WARP HTTP 代理（容器内部网络）
      - HTTP_PROXY=http://epic-warp:19000
      - HTTPS_PROXY=http://epic-warp:19000
      # WARP 代理配置（用于检测、选择端口和重启单个出口）
      - WARP_PROXY_HOST=epic-warp
      - WARP_PROXY_START_PORT=19000
      - WARP_PROXY_COUNT=10
      - WARP_CONTROL_URL_TEMPLATE=http://epic-warp:18080/restart/{idx}
      # 内部服务不走代理（修复入库 API 失败问题）
      - NO_PROXY=web,epic-web,redis,epic-redis,localhost,127.0.0.1
      # ============================================================
      # API Key must be configured in .env.
      # Supports NVIDIA, SiliconFlow, or custom OpenAI-compatible providers.
      # Do not commit real keys in docker-compose.yml.
      # ============================================================
      # 环境变量（绕过父类验证器，无需修改）
      - GEMINI_API_KEY=not_used
      # ============================================================
      # 模型配置（SiliconFlow 实测通过）
      - CAPTCHA_PRIMARY_BASE_URL=${CAPTCHA_PRIMARY_BASE_URL:-https://api.siliconflow.cn/v1}
      - CAPTCHA_PRIMARY_MODEL=${CAPTCHA_PRIMARY_MODEL:-zai-org/GLM-4.5V}
      - CAPTCHA_SECONDARY_BASE_URL=${CAPTCHA_SECONDARY_BASE_URL:-https://api.siliconflow.cn/v1}
      - CAPTCHA_SECONDARY_MODEL=${CAPTCHA_SECONDARY_MODEL:-moonshotai/Kimi-K2.7-Code}
      - CAPTCHA_TERTIARY_BASE_URL=${CAPTCHA_TERTIARY_BASE_URL:-https://api.siliconflow.cn/v1}
      - CAPTCHA_TERTIARY_MODEL=${CAPTCHA_TERTIARY_MODEL:-Pro/moonshotai/Kimi-K2.6}
      - CAPTCHA_RESPONSE_MAX_TOKENS=1200
      - CAPTCHA_TOTAL_API_BUDGET=150
      # 可选：外部验证码服务商 fallback（默认关闭；Key 只放 .env）
      - CAPTCHA_PROVIDER=${CAPTCHA_PROVIDER:-none}
      - CAPTCHA_PROVIDER_API_KEY=${CAPTCHA_PROVIDER_API_KEY:-}
      - CAPTCHA_PROVIDER_SITE_KEY=${CAPTCHA_PROVIDER_SITE_KEY:-91e4137f-95af-4bc9-97af-cdcedce21c8c}
      - CAPTCHA_PROVIDER_TIMEOUT=${CAPTCHA_PROVIDER_TIMEOUT:-180}
      - CAPTCHA_PROVIDER_POLL_INTERVAL=${CAPTCHA_PROVIDER_POLL_INTERVAL:-5}
      - PRIMARY_MODEL=deepseek-ai/DeepSeek-V4-Flash
      - PRIMARY_MODEL_FALLBACK=deepseek-ai/DeepSeek-V4-Pro
      # 验证码失败后的自动恢复策略
      - COOKIE_INVALID_MAX_RETRIES=${COOKIE_INVALID_MAX_RETRIES:-1}
      - CAPTCHA_FAILURE_MAX_RETRIES=2
      - CAPTCHA_FAILURE_RETRY_DELAY_SECONDS=900
      - NETWORK_FAILURE_MAX_RETRIES=2
      - NETWORK_FAILURE_RETRY_DELAY_SECONDS=600
      - WARP_RESTART_COOLDOWN_SECONDS=300
      - WARP_CONTROL_RESTART_RETRIES=${WARP_CONTROL_RESTART_RETRIES:-3}
      - WARP_CONTROL_RESTART_BACKOFF_SECONDS=${WARP_CONTROL_RESTART_BACKOFF_SECONDS:-5}
      - WARP_CONTAINER_FALLBACK_RESTARTS=0
      - TASK_SPACING_SECONDS=5
    depends_on:
      redis:
        condition: service_healthy
      warp:
        condition: service_healthy
    restart: always
    secrets:
      - internal_api_token
      - epic_credential_keys
      - captcha_nvidia_api_key
      - captcha_siliconflow_api_key
    healthcheck:
      test: ["CMD", "python", "-c", "import os,time,redis; r=redis.Redis(host=os.getenv('REDIS_HOST','redis')); v=r.get('worker:heartbeat'); raise SystemExit(0 if v and time.time()-float(v)<90 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 4g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  test:
    profiles: ["test"]
    init: true
    build:
      context: .
      dockerfile: Dockerfile.test
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=512m
      - /usr/local/lib/python3.12/site-packages/hcaptcha_challenger/logs:size=64m
    environment:
      - DATA_DIR=/tmp/epic-kiosk-test
      - ENABLE_APSCHEDULER=false
      - INTERNAL_API_TOKEN=test-internal-token
      - EPIC_CREDENTIAL_KEYS=9QKUvZF-uPSzD4suKpprhwUTUyoj5nrR9BgeJeAs5mM=

secrets:
  internal_api_token:
    file: ${INTERNAL_API_TOKEN_PATH:?set INTERNAL_API_TOKEN_PATH}
  epic_credential_keys:
    file: ${EPIC_CREDENTIAL_KEYS_PATH:?set EPIC_CREDENTIAL_KEYS_PATH}
  captcha_nvidia_api_key:
    file: ${CAPTCHA_NVIDIA_API_KEY_PATH:?set CAPTCHA_NVIDIA_API_KEY_PATH}
  captcha_siliconflow_api_key:
    file: ${CAPTCHA_SILICONFLOW_API_KEY_PATH:?set CAPTCHA_SILICONFLOW_API_KEY_PATH}
