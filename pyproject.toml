[project]
name = "epic-kiosk"
version = "0.4.1"
dependencies = [
    "apscheduler>=3.11.0",
    "browserforge>=1.2.0",
    "camoufox[geoip]==0.4.11",
    "cryptography>=45.0.0",
    "fastapi>=0.115.0",
    "hcaptcha-challenger[camoufox]==0.19.0",
    "httpx>=0.28.0",
    "jinja2>=3.1.0",
    "loguru>=0.7.0",
    "playwright==1.56.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.8.1",
    "python-multipart>=0.0.20",
    "pytz>=2024.1",
    "redis>=5.0.0",
    "requests>=2.32.0",
    "tenacity>=8.5.0",
    "uvicorn>=0.30.0",
]
# <=3.13 会把 3.13.1 这类补丁版本排除在外，正确写法是 <3.14
requires-python = ">=3.12,<3.14"
authors = [
    { name = "一万", email = "10000ge10000@gmail.com" }
]
description = "🍷 Gracefully claim weekly free games from Epic Store."
readme = "README.md"
license = "GPL-3.0-or-later"
keywords = ["epic", "epic-kiosk", "epic-games-store"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/10000ge10000/epic-kiosk"
Documentation = "https://github.com/10000ge10000/epic-kiosk"
Repository = "https://github.com/10000ge10000/epic-kiosk.git"
Issues = "https://github.com/10000ge10000/epic-kiosk/issues"
Changelog = "https://github.com/10000ge10000/epic-kiosk/blob/main/CHANGELOG.md"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]
skip-string-normalization = true

[tool.pytest.ini_options]
# 必须带上仓库根：测试里同时用了 `import worker` / `import main` /
# `from scripts.migrate_secure_storage import ...`（需要 <rootdir>）和
# `from app.secure_store import ...`（也需要 <rootdir>），
# 只加 <rootdir>/app 的话在仓库根直接跑 pytest 会 ModuleNotFoundError。
pythonpath = [".", "app"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E501 交给 black 管；E722 专门用来抓裸 except:
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "pytest>=8.3.5",
    "fakeredis>=2.30.0",
    "ruff>=0.12.3",
]
